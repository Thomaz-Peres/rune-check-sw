[package]
name = "sw_rune_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
rcgen = { version = "0.14.7", features = ["pem", "x509-parser"] }
rustls = "0.23.39"
tokio = { version = "1.52.1", features = ["full"] }
tokio-rustls = "0.26.4"
webpki-roots = "1.0.7"
aes = "0.9.1"
base64 = "0.22.1"
cbc = { version = "0.2.1", features = ["alloc"] }
flate2 = "1.1.9"
